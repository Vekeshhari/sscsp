name: SSCSP CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  # ─── Job 1: Build + Test + Security ────────────────────
  build-test-secure:
    name: Build · Test · Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Unit tests
        working-directory: backend
        run: pytest tests/test_scanner.py -v --cov=app

      - name: Integration tests
        working-directory: backend
        run: pytest tests/test_integration.py -v

      - name: E2E test
        working-directory: backend
        run: pytest tests/test_e2e.py -v

      - name: Fuzzing test
        working-directory: backend
        run: pytest tests/test_fuzz.py -v --hypothesis-show-statistics

      - name: SAST — Bandit
        working-directory: backend
        run: bandit -r app -ll -f json -o bandit.json || true

      - name: SAST — Semgrep
        run: semgrep --config=auto --error backend/app || true

      - name: Dependency scan — pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt || true

      - name: Secret scan — Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit.json
            backend/coverage.xml

  # ─── Job 2: Docker build + cosign sign ─────────────────
  package:
    name: Docker · Sign
    needs: build-test-secure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t sscsp/backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t sscsp/frontend:${{ github.sha }} ./frontend

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sscsp/backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          cosign sign --yes sscsp/backend:${{ github.sha }} || true
          cosign sign --yes sscsp/frontend:${{ github.sha }} || true

  # ─── Job 3: Deploy to staging ──────────────────────────
  deploy-staging:
    name: Deploy (staging)
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Minikube (self-hosted runner simulation)
        run: |
          echo "In production this would use a real cluster."
          echo "kubectl apply -k infra/k8s/"

      - name: Notify
        run: echo "Deployed sscsp ${{ github.sha }} to staging."

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sscsp
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sscsp
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173

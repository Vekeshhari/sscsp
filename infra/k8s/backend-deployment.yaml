apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sscsp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sscsp-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://sscsp:sscsp_dev_pw@db:5432/sscsp
